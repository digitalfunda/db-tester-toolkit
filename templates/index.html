<!doctype html><html><head><meta charset="utf-8"><title>DB Tester Toolkit</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2333;--mut:#6b7488;--pri:#3b5bdb;--line:#e2e6ee;--ok:#2b9348;--warn:#e08a00;--bad:#d62839}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#1c2333;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px}
header b{font-size:16px}.pill{padding:3px 10px;border-radius:12px;font-size:12px;background:#364060}.pill.on{background:var(--ok)}
header label{margin-left:auto;font-size:13px;display:flex;gap:6px;align-items:center}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;padding:0 14px}
nav a{padding:11px 16px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;font-weight:500}
nav a.on{color:var(--pri);border-color:var(--pri)}
main{padding:18px 20px;max-width:1280px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:15px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1;min-width:150px}
label.l{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid #cfd5e2;border-radius:6px;font:inherit;background:#fff}
textarea{font-family:Consolas,monospace;min-height:110px}
button{background:var(--pri);color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font:inherit;font-weight:500}
button.sec{background:#e9edf8;color:var(--pri)}button.red{background:#fde8ea;color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}th{background:#eef1f8;text-align:left;padding:7px 10px;position:sticky;top:0}
td{padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}tr:hover td{background:#f8f9fd}.null{color:#aab;font-style:italic}
.scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.badge{padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600}.PASS{background:#e0f5e6;color:var(--ok)}.WARN{background:#fff0d6;color:var(--warn)}.FAIL{background:#fde8ea;color:var(--bad)}
.msg{padding:9px 12px;border-radius:6px;margin:10px 0}.msg.err{background:#fde8ea;color:var(--bad)}.msg.ok{background:#e0f5e6;color:var(--ok)}
.meta{color:var(--mut);font-size:12px;margin:6px 0}code,pre{font-family:Consolas,monospace}pre{background:#10162a;color:#cfe3ff;padding:12px;border-radius:6px;overflow:auto;margin:8px 0}
.tbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.tb{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.tb h4{margin:0;padding:8px 12px;background:#eef1f8;display:flex;justify-content:space-between;font-size:13px}.tb div{padding:3px 12px;font-size:12.5px;display:flex;justify-content:space-between}.tb i{color:var(--mut);font-style:normal}
