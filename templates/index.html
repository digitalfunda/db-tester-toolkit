<!doctype html><html><head><meta charset="utf-8"><title>DB Tester Toolkit</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2333;--mut:#6b7488;--pri:#3b5bdb;--line:#e2e6ee;--ok:#2b9348;--warn:#e08a00;--bad:#d62839}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#1c2333;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px}
header b{font-size:16px}.pill{padding:3px 10px;border-radius:12px;font-size:12px;background:#364060}.pill.on{background:var(--ok)}
header label{margin-left:auto;font-size:13px;display:flex;gap:6px;align-items:center}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;padding:0 14px}
nav a{padding:11px 16px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;font-weight:500}
nav a.on{color:var(--pri);border-color:var(--pri)}
main{padding:18px 20px;max-width:1280px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:15px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1;min-width:150px}
label.l{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid #cfd5e2;border-radius:6px;font:inherit;background:#fff}
textarea{font-family:Consolas,monospace;min-height:110px}
button{background:var(--pri);color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font:inherit;font-weight:500}
button.sec{background:#e9edf8;color:var(--pri)}button.red{background:#fde8ea;color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}th{background:#eef1f8;text-align:left;padding:7px 10px;position:sticky;top:0}
td{padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}tr:hover td{background:#f8f9fd}.null{color:#aab;font-style:italic}
.scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.badge{padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600}.PASS{background:#e0f5e6;color:var(--ok)}.WARN{background:#fff0d6;color:var(--warn)}.FAIL{background:#fde8ea;color:var(--bad)}
.msg{padding:9px 12px;border-radius:6px;margin:10px 0}.msg.err{background:#fde8ea;color:var(--bad)}.msg.ok{background:#e0f5e6;color:var(--ok)}
.meta{color:var(--mut);font-size:12px;margin:6px 0}code,pre{font-family:Consolas,monospace}pre{background:#10162a;color:#cfe3ff;padding:12px;border-radius:6px;overflow:auto;margin:8px 0}
.tbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.tb{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.tb h4{margin:0;padding:8px 12px;background:#eef1f8;display:flex;justify-content:space-between;font-size:13px}.tb div{padding:3px 12px;font-size:12.5px;display:flex;justify-content:space-between}.tb i{color:var(--mut);font-style:normal}
.chip{display:inline-block;background:#eef1f8;border-radius:12px;padding:3px 10px;margin:2px;font-size:12.5px;cursor:pointer}.chip input{width:auto;margin-right:4px}
.jn{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;background:#f8f9fd;border-radius:6px;flex-wrap:wrap}.jn select{width:auto;min-width:120px}
.tag{font-size:11px;background:#e9edf8;color:var(--pri);padding:1px 7px;border-radius:8px;margin-left:6px}
.hide{display:none}
</style></head><body>
<header><b>🛢 DB Tester Toolkit</b><span class="pill" id="st">Not connected</span>
<label><input type="checkbox" id="ro" checked style="width:auto" onchange="api('/api/mode',{readonly:this.checked})"> Read-only mode (safe)</label></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const TABS=["Connections","Schema","Join Builder","Query","Compare","Data Checks","Snapshots"];let S={schema:null,res:null,J:{base:"",joins:[],cols:{}}};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function api(u,b,m){const r=await fetch(u,b?{method:m||"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});return r.json()}
function nav(t){$("nav").innerHTML=TABS.map(x=>`<a class="${x==t?'on':''}" onclick="go('${x}')">${x}</a>`).join("");}
async function go(t){nav(t);const m=$("main");m.innerHTML="";await V[t](m)}
function grid(c,r){if(!c.length)return'<div class="msg ok">Statement executed.</div>';return`<div class="scroll"><table><tr>${c.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>${r.map(w=>`<tr>${w.map(v=>`<td>${v===null?'<span class=null>NULL</span>':esc(v)}</td>`).join("")}</tr>`).join("")}</table></div>`}
function csv(c,r){const e=v=>v==null?"":'"'+String(v).replace(/"/g,'""')+'"';const b=new Blob([[c.map(e).join(",")].concat(r.map(w=>w.map(e).join(","))).join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="result.csv";a.click()}
function tblOpts(){return Object.keys(S.schema.tables).map(t=>`<option>${t}</option>`).join("")}
function need(m){if(!S.schema){m.innerHTML='<div class="msg err">Not connected. Open the Connections tab and click Connect.</div>';return false}return true}
const V={
async Connections(m){const L=await api("/api/connections");m.innerHTML=`<div class="card"><h3>Saved connections</h3><table><tr><th>Name</th><th>Type</th><th>Target</th><th></th></tr>${L.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${c.type}</td><td>${esc(c.conn_string||c.host||c.database||"built-in demo data")}</td><td style="text-align:right"><button class="sec" onclick="conn('${esc(c.name)}',1)">Test</button> <button onclick="conn('${esc(c.name)}')">Connect</button> <button class="red" onclick="del('${esc(c.name)}')">✕</button></td></tr>`).join("")}</table><div id="cm"></div></div>
<div class="card"><h3>Add / edit connection</h3><div class="row"><div><label class="l">Profile name</label><input id="n" placeholder="QA-Oracle"></div><div><label class="l">Database type</label><select id="t" onchange="ty()"><option value="oracle">Oracle</option><option value="mssql">SQL Server (MSSQL)</option><option value="mysql">MySQL / MariaDB</option><option value="sqlite">SQLite file</option></select></div><div><label class="l">Login mode</label><select id="md"></select></div><div><label class="l">Schema / owner (optional)</label><input id="sc" placeholder="HR  |  dbo"></div></div>
<div class="row" style="margin-top:10px" id="f1"><div><label class="l">Host</label><input id="h" placeholder="db-qa.company.com"></div><div style="max-width:110px"><label class="l">Port</label><input id="p" placeholder="1521"></div><div><label class="l" id="svl">Service name</label><input id="sv" placeholder="ORCLPDB1"></div></div>
<div class="row" style="margin-top:10px" id="f2"><div><label class="l">Username</label><input id="u"></div><div><label class="l">Password</label><input id="pw" type="password"></div></div>
<div style="margin-top:10px"><label class="l">…or paste a full connection string / DSN (overrides fields above)</label><input id="cs" placeholder="host:1521/service  |  DRIVER={ODBC Driver 17 for SQL Server};SERVER=...  |  mysql: host:3306/dbname"></div>
<div style="margin-top:12px"><button onclick="saveC()">💾 Save profile</button> <span class="meta">Passwords are stored only on this PC (~/.dbtester).</span></div></div>`;ty()},
async Schema(m){if(!need(m))return;const s=S.schema;m.innerHTML=`<div class="meta">${Object.keys(s.tables).length} tables · ${s.fks.length} foreign keys</div><div class="tbls">${Object.entries(s.tables).map(([n,t])=>`<div class="tb"><h4>${n}<span class="tag">${t.rows??"?"} rows</span></h4>${t.cols.map(c=>`<div><span>${c.pk?"🔑 ":""}${c.name}${s.fks.some(f=>f.t==n&&f.c==c.name)?" 🔗":""}</span><i>${c.type}</i></div>`).join("")}</div>`).join("")}</div>`},
async "Join Builder"(m){if(!need(m))return;const J=S.J;if(!J.base)J.base=Object.keys(S.schema.tables)[0];drawJ(m)},
async Query(m){const H=await api("/api/history");m.innerHTML=`<div class="card"><h3>SQL editor</h3><textarea id="sql" placeholder="SELECT * FROM ...">${esc(S.lastSql||"")}</textarea><div class="row" style="margin-top:8px"><div style="max-width:120px"><label class="l">Max rows</label><input id="lim" value="500"></div><div style="flex:0"><button onclick="run()">▶ Run</button></div><div style="flex:0"><button class="sec" onclick="S.res&&csv(S.res.cols,S.res.rows)">⬇ CSV</button></div><div><label class="l">History</label><select onchange="if(this.value)$('sql').value=this.value"><option value="">Recent queries…</option>${H.map(h=>`<option value="${esc(h.sql)}">${h.ts} · ${esc(h.sql.slice(0,60))}</option>`).join("")}</select></div></div><div id="out"></div></div>`;if(S.lastSql&&S.res)show(S.res)},
async Compare(m){if(!need(m))return;const L=await api("/api/connections"),co=`<option value="">Current connection</option>`+L.map(c=>`<option>${esc(c.name)}</option>`).join("");m.innerHTML=`<div class="card"><h3>Compare two result sets (before vs after, or Oracle vs SQL Server)</h3><div class="row"><div><label class="l">Connection for A</label><select id="ca">${co}</select><label class="l" style="margin-top:6px">Query A (expected / source)</label><textarea id="a">SELECT id, name, email FROM customers WHERE country='US'</textarea></div><div><label class="l">Connection for B</label><select id="cb">${co}</select><label class="l" style="margin-top:6px">Query B (actual / target)</label><textarea id="b">SELECT id, name, email FROM customers WHERE id IN (1,3,4)</textarea></div></div><div class="row" style="margin-top:8px"><div><label class="l">Key column(s), comma separated (optional)</label><input id="k" value="id"></div><div style="flex:0"><button onclick="cmp()">⇄ Compare</button></div></div><div id="co"></div></div>`},
async "Data Checks"(m){if(!need(m))return;m.innerHTML=`<div class="card"><h3>Automatic data-quality checks</h3><div class="row"><div><label class="l">Table</label><select id="ct">${tblOpts()}</select></div><div style="flex:0"><button onclick="chk()">✔ Run checks</button></div><div style="flex:0"><button class="sec" onclick="chkAll()">Run on all tables</button></div></div><div class="meta">Row count · NULLs · duplicate emails/names · orphan foreign-key rows</div><div id="cko"></div></div>`},
async Snapshots(m){if(!need(m))return;const L=await api("/api/snapshots");m.innerHTML=`<div class="card"><h3>Row-count snapshots</h3><div class="meta">Take a snapshot before executing a test, another after, and see which tables changed.</div><div class="row"><div><input id="sn" placeholder="e.g. before-order-test"></div><div style="flex:0"><button onclick="snap()">📸 Take snapshot</button></div></div></div>
<div class="card"><h3>Saved snapshots</h3>${Object.entries(L).map(([k,v])=>`<div class="jn"><b>${esc(k)}</b><span class="meta">${v.ts} · ${esc(v.conn)}</span><button class="sec" onclick="sdiff('${esc(k)}')">Compare with current DB</button></div>`).join("")||'<div class="meta">No snapshots yet.</div>'}<div id="so"></div></div>`}};
async function conn(n,t){const r=await api("/api/connect",{name:n,test_only:!!t});const e=$("cm");if(r.error){e.innerHTML=`<div class="msg err">${esc(r.error)}</div>`;return}
if(t){e.innerHTML=`<div class="msg ok">✔ ${r.msg}</div>`;return}S.schema=r.schema;$("st").textContent="● "+n;$("st").className="pill on";e.innerHTML=`<div class="msg ok">✔ Connected to ${esc(n)} — ${Object.keys(r.schema.tables).length} tables loaded.</div>`}
async function saveC(){const t=$("t").value;await api("/api/connections",{name:$("n").value,type:t,host:$("h").value,port:$("p").value,service:t=="oracle"?$("sv").value:"",database:t!="oracle"?$("sv").value:"",user:$("u").value,password:$("pw").value,conn_string:$("cs").value,mode:$("md").value,schema:$("sc").value});go("Connections")}
async function del(n){await api("/api/connections",{name:n},"DELETE");go("Connections")}
function ty(){const t=$("t").value;$("md").innerHTML=t=="oracle"?'<option value="service">Service name</option><option value="sid">SID</option>':t=="mssql"?'<option value="sql">SQL login (user/password)</option><option value="windows">Windows authentication</option>':'<option>–</option>';$("md").onchange=()=>{const w=$("md").value=="windows";$("u").disabled=$("pw").disabled=w};$("svl").textContent=t=="oracle"?"Service name / SID":t=="sqlite"?"File path":"Database";$("sv").placeholder=t=="oracle"?"ORCLPDB1":t=="sqlite"?"C:\\data\\test.db":"QA_DB";$("p").placeholder=t=="oracle"?"1521":t=="mysql"?"3306":"1433"}
function show(r){S.res=r;$("out").innerHTML=r.error?`<div class="msg err">${esc(r.error)}</div>`:`<div class="meta">${r.rows.length} rows · ${r.ms} ms</div>`+grid(r.cols,r.rows)}
async function run(){S.lastSql=$("sql").value;show(await api("/api/query",{sql:S.lastSql,limit:$("lim").value}))}
// ---- join builder
function fk(a,b){const f=S.schema.fks.find(f=>f.t==a&&f.rt==b);if(f)return[f.c,f.rc];const g=S.schema.fks.find(f=>f.t==b&&f.rt==a);return g?[g.rc,g.c]:null}
function jsql(){const J=S.J,T=[J.base,...J.joins.map(j=>j.table)];let sel=[];T.forEach((t,i)=>S.schema.tables[t].cols.forEach(c=>{if(J.cols[t+"."+c.name])sel.push(`t${i}.${c.name}`)}));
let s=`SELECT ${sel.join(", ")||"*"}\nFROM ${J.base} t0`;J.joins.forEach((j,i)=>{s+=`\n${j.type} JOIN ${j.table} t${i+1} ON t${T.indexOf(j.lt)}.${j.lc} = t${i+1}.${j.rc}`});if(J.where)s+=`\nWHERE ${J.where}`;return s}
function addJoin(){const J=S.J,used=[J.base,...J.joins.map(j=>j.table)];let cand=null;for(const t of Object.keys(S.schema.tables)){if(used.includes(t))continue;for(const u of used){const k=fk(u,t);if(k){cand={type:"INNER",table:t,lt:u,lc:k[0],rc:k[1]};break}}if(cand)break}
if(!cand){const t=Object.keys(S.schema.tables).find(x=>!used.includes(x));if(!t)return;cand={type:"INNER",table:t,lt:J.base,lc:S.schema.tables[J.base].cols[0].name,rc:S.schema.tables[t].cols[0].name}}J.joins.push(cand);drawJ($("main"))}
function drawJ(m){const J=S.J,T=[J.base,...J.joins.map(j=>j.table)],ts=Object.keys(S.schema.tables),op=(a,v)=>a.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join(""),cs=t=>S.schema.tables[t].cols.map(c=>c.name);
m.innerHTML=`<div class="card"><h3>Visual join builder <span class="tag">auto-detects foreign keys</span></h3><div class="row"><div style="max-width:260px"><label class="l">Start with table</label><select onchange="S.J={base:this.value,joins:[],cols:{}};drawJ($('main'))">${op(ts,J.base)}</select></div><div style="flex:0"><button class="sec" onclick="addJoin()">＋ Add join</button></div></div>
${J.joins.map((j,i)=>`<div class="jn"><select onchange="J_(${i},'type',this.value)">${op(["INNER","LEFT","RIGHT","FULL"],j.type)}</select> JOIN <select onchange="J_(${i},'table',this.value)">${op(ts,j.table)}</select> ON <select onchange="J_(${i},'lt',this.value)">${op(T.slice(0,i+1),j.lt)}</select>.<select onchange="J_(${i},'lc',this.value)">${op(cs(j.lt),j.lc)}</select> = ${j.table}.<select onchange="J_(${i},'rc',this.value)">${op(cs(j.table),j.rc)}</select><button class="red" onclick="S.J.joins.splice(${i},1);drawJ($('main'))">✕</button></div>`).join("")}
<label class="l" style="margin-top:10px">Columns to return (tick to choose, none = all)</label>${T.map(t=>`<div><b>${t}</b> ${cs(t).map(c=>`<span class="chip"><input type="checkbox" ${J.cols[t+"."+c]?"checked":""} onchange="S.J.cols['${t}.${c}']=this.checked;drawJ($('main'))">${c}</span>`).join("")}</div>`).join("")}
<label class="l" style="margin-top:10px">WHERE (optional)</label><input value="${esc(J.where||"")}" placeholder="t0.status = 'SHIPPED'" onchange="S.J.where=this.value;drawJ($('main'))"><pre>${esc(jsql())}</pre>
<button onclick="runJ()">▶ Run join</button> <button class="sec" onclick="S.lastSql=jsql();go('Query')">Open in SQL editor</button> <button class="sec" onclick="navigator.clipboard.writeText(jsql())">Copy SQL</button><div id="out"></div></div>`}
function J_(i,k,v){S.J.joins[i][k]=v;if(k=="table"){const j=S.J.joins[i],T=[S.J.base,...S.J.joins.map(x=>x.table)];for(const u of T.slice(0,i+1)){const f=fk(u,v);if(f){j.lt=u;j.lc=f[0];j.rc=f[1];break}}}drawJ($("main"))}
async function runJ(){S.lastSql=jsql();show(await api("/api/query",{sql:S.lastSql,limit:500}))}
async function cmp(){const r=await api("/api/compare",{a:$("a").value,b:$("b").value,key:$("k").value,connA:$("ca").value,connB:$("cb").value});const o=$("co");if(r.error){o.innerHTML=`<div class="msg err">${esc(r.error)}</div>`;return}
const ok=!r.onlyA.length&&!r.onlyB.length&&!r.changed.length;o.innerHTML=`<div class="msg ${ok?"ok":"err"}">${ok?"✔ Result sets are identical":"✘ Differences found"} — A: ${r.countA} rows, B: ${r.countB} rows</div>`+(r.onlyA.length?`<h3>Only in A (${r.onlyA.length})</h3>`+grid(r.colsA,r.onlyA):"")+(r.onlyB.length?`<h3 style="margin-top:12px">Only in B (${r.onlyB.length})</h3>`+grid(r.colsB,r.onlyB):"")+(r.changed.length?`<h3 style="margin-top:12px">Changed values (${r.changed.length})</h3>`+grid([...r.keycols,"differences"],r.changed):"")}
function chkTbl(t,res){return`<h3 style="margin-top:12px">${t}</h3><table><tr><th>Check</th><th>Status</th><th>Detail</th></tr>${res.map(x=>`<tr><td>${esc(x.check)}</td><td><span class="badge ${x.status}">${x.status}</span></td><td>${esc(x.detail)}</td></tr>`).join("")}</table>`}
async function chk(){const t=$("ct").value,r=await api("/api/checks",{table:t});$("cko").innerHTML=r.error?`<div class="msg err">${esc(r.error)}</div>`:chkTbl(t,r)}
async function chkAll(){let h="";for(const t of Object.keys(S.schema.tables)){const r=await api("/api/checks",{table:t});if(!r.error)h+=chkTbl(t,r)}$("cko").innerHTML=h}
async function snap(){if(!$("sn").value)return;await api("/api/snapshots",{name:$("sn").value});go("Snapshots")}
async function sdiff(n){const r=await api("/api/snapshots",{name:n,diff:1});$("so").innerHTML=`<h3 style="margin-top:12px">Changes since “${esc(n)}”</h3><table><tr><th>Table</th><th>Before</th><th>Now</th><th>Change</th></tr>${r.map(x=>`<tr><td>${x.table}</td><td>${x.before??"–"}</td><td>${x.after??"–"}</td><td><span class="badge ${x.delta?"WARN":"PASS"}">${x.delta>0?"+":""}${x.delta}</span></td></tr>`).join("")}</table>`}
go("Connections");
</script></body></html>
